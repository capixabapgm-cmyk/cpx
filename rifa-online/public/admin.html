<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Painel • Minhas Rifas</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="brand">MINHAS RIFAS</span><h1>Painel de convites</h1><p>Convide organizadores para criar suas próprias contas.</p></header><section id="access" class="order"><form id="login"><h2>Entrar como administrador</h2><label>E-mail<input id="email" type="email" autocomplete="username" value="franciscoandrade.photo@gmail.com" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><button>Entrar</button></form><details><summary>Primeira ativação do administrador</summary><form id="setup"><label>Nome<input id="setup-name" value="Francisco Claudemir da Silva Andrade" required></label><label>E-mail<input id="setup-email" type="email" value="franciscoandrade.photo@gmail.com" required></label><label>Nova senha (mínimo de 12 caracteres)<input id="setup-password" type="password" autocomplete="new-password" minlength="12" required></label><label>Código de ativação configurado no Cloudflare<input id="setup-key" type="password" autocomplete="off" minlength="32" required></label><button>Ativar minha conta</button></form></details></section><p id="message" role="status"></p><section id="panel" hidden><div class="top"><h2 id="who"></h2><button id="logout" class="secondary">Sair</button></div><section class="order"><h2>Convidar organizador</h2><form id="invite"><label>E-mail do convidado (opcional)<input id="invite-email" type="email"></label><p class="note">Validade de 7 dias, apenas um cadastro. O link do APK acompanha o código na mensagem.</p><button>Gerar convite</button></form><textarea id="invitation" rows="8" readonly hidden></textarea><button id="share" hidden>Compartilhar convite e APK</button><p id="copied" role="status"></p></section><h2>Convites</h2><div id="invites"></div><h2>Usuários</h2><div id="users"></div></section></main><script type="module" src="/admin.js"></script></body></html>
